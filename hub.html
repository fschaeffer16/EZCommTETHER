<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EZvoxa Master Hub</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#0b0f19;color:#f9fafb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
  body{padding:22px 18px 60px;max-width:720px;margin:0 auto}
  h1{font-size:20px;margin:0 0 4px}
  .sub{font-size:14px;color:#9ca3af;margin:0 0 18px;line-height:1.45}
  form.pw{display:flex;gap:10px;margin-bottom:20px}
  form.pw[hidden]{display:none}
  input[type=password]{flex:1;background:#111827;border:1px solid #1f2937;border-radius:8px;color:#f9fafb;font-size:17px;padding:12px 14px;min-width:0}
  button{background:#38bdf8;color:#0b0f19;border:0;border-radius:8px;font-size:15px;font-weight:800;padding:10px 16px;cursor:pointer}
  #msg{font-size:15px;color:#fca5a5;min-height:22px}
  a{color:#38bdf8}
</style>
<h1>EZvoxa Master Hub</h1>
<p class="sub">Frank's page, as written. Family password to open; it carries prices. The finance model's view of the same ramp is at <a href="hub-model.html">hub-model.html</a>.</p>
<form class="pw" id="f">
  <input id="pw" type="password" autocomplete="current-password" placeholder="Family password">
  <button type="submit">Open</button>
</form>
<div id="msg"></div>
<script>
document.getElementById('f').addEventListener('submit', async function (ev) {
  ev.preventDefault();
  var msg = document.getElementById('msg'); msg.textContent = 'Loading…';
  try {
    var r = await fetch('/api/hub', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('pw').value }) });
    var j = await r.json();
    if (!j.ok) { msg.textContent = j.error === 'bad_password' ? 'Wrong password.' : 'Could not load.'; return; }
    document.open(); document.write(j.html); document.close();
  } catch (e) { msg.textContent = 'Could not reach the server.'; }
});
</script>
