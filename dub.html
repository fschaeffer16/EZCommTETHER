<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EZvoxa Voice Dub</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#0A0A0F;color:#EFEAE2;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
  body{padding:22px 18px 60px;max-width:760px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px}
  .sub{font-size:14px;color:#8C857A;margin:0 0 18px;line-height:1.45}
  form{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
  input{flex:1;background:#16130E;border:1px solid #2B241C;border-radius:10px;color:#EFEAE2;font-size:17px;padding:12px 14px;min-width:200px}
  button{background:#FFB020;color:#0A0A0F;border:0;border-radius:10px;font-size:16px;font-weight:800;padding:12px 20px;cursor:pointer}
  button[disabled]{opacity:.5;cursor:default}
  #msg{font-size:15px;color:#FF9A8A;min-height:22px;margin-bottom:10px}
  .bar{height:14px;background:#2B241C;border-radius:7px;overflow:hidden;margin:10px 0}
  .bar div{height:100%;background:#7DE59A;width:0}
  .stat{font-size:15px;color:#7DE59A;font-weight:700}
  .list{font-size:13px;color:#B0A695;white-space:pre-wrap;max-height:300px;overflow:auto;border:1px solid #2B241C;border-radius:10px;padding:10px;margin-top:12px}
  iframe{width:1px;height:1px;opacity:0;position:absolute;left:-9999px}
</style>

<h1>EZvoxa Voice Dub</h1>
<p class="sub">Speaks every phrase in Evan's app into the server's memory once, so a tap on his phone never costs ElevenLabs again. Phrases already stored are skipped. Run it once; run it again after adding buttons or changing the voice. Nothing shows without the family password.</p>

<form id="f">
  <input id="pw" type="password" autocomplete="current-password" placeholder="Family password">
  <button type="submit" id="go">Start the dub</button>
</form>
<div id="msg"></div>
<div class="stat" id="stat"></div>
<div class="bar"><div id="fill"></div></div>
<div class="list" id="list" hidden></div>
<iframe id="app" src="index.html" title="Evan's app, loaded to read its phrases"></iframe>

<script>
(function () {
  var msg = document.getElementById('msg'), stat = document.getElementById('stat'), fill = document.getElementById('fill'), list = document.getElementById('list'), go = document.getElementById('go');
  // The phrase list comes from the app itself, running in the hidden frame,
  // so it always matches what the phone can say.
  function findApp(win) {
    try {
      var el = win.document.querySelector('#dc-root'); if (!el) return null;
      var key = Object.keys(el).find(function (k) { return k.indexOf('__reactContainer') === 0; });
      var f = el[key]; if (f && f.stateNode && f.stateNode.current) f = f.stateNode.current;
      var seen = new Set(), stack = [f];
      while (stack.length) { var n = stack.pop(); if (!n || seen.has(n)) continue; seen.add(n); if (n.stateNode && n.stateNode.logic) return n.stateNode.logic; if (n.child) stack.push(n.child); if (n.sibling) stack.push(n.sibling); }
    } catch (e) {}
    return null;
  }
  function phrases() {
    var win = document.getElementById('app').contentWindow;
    var app = findApp(win);
    if (!app || typeof app.dubPhrases !== 'function') return null;
    return app.dubPhrases();
  }
  document.getElementById('f').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    var pw = document.getElementById('pw').value;
    var all = phrases();
    if (!all) { msg.textContent = 'The app has not finished loading yet. Wait a few seconds and try again.'; return; }
    go.disabled = true; msg.textContent = ''; list.hidden = false; list.textContent = '';
    var made = 0, kept = 0, failed = [], done = 0, batch = 6;
    stat.textContent = all.length + ' phrases to check.';
    for (var i = 0; i < all.length; i += batch) {
      var chunk = all.slice(i, i + batch);
      try {
        var r = await fetch('/api/speak', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'dub', password: pw, phrases: chunk }) });
        var j = await r.json();
        if (!j.ok) { msg.textContent = j.error === 'bad_password' ? 'Wrong password.' : ('Stopped: ' + (j.error || 'unknown')); go.disabled = false; return; }
        made += j.made; kept += j.kept; failed = failed.concat(j.failed || []);
      } catch (e) { failed = failed.concat(chunk); }
      done = Math.min(all.length, i + batch);
      fill.style.width = Math.round(100 * done / all.length) + '%';
      stat.textContent = done + ' of ' + all.length + ' checked. ' + made + ' newly spoken, ' + kept + ' already stored' + (failed.length ? ', ' + failed.length + ' failed' : '') + '.';
    }
    list.textContent = (failed.length ? 'Failed (try again later):\n' + failed.join('\n') + '\n\n' : '') + 'All phrases:\n' + all.join('\n');
    msg.textContent = failed.length ? 'Done, with failures listed below.' : 'Done. Every phrase is stored.';
    go.disabled = false;
  });
})();
</script>
